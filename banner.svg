<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B1A"/>
      <stop offset="0.6" stop-color="#12123A"/>
      <stop offset="1" stop-color="#1B1F4B"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="300" fill="black"/>
      <circle cx="1020" cy="150" r="70" fill="white"/>
      <circle cx="1048" cy="136" r="62" fill="black"/>
    </mask>
    <style>
      .t { animation: twinkle 3s ease-in-out infinite; }
      .t2 { animation: twinkle 4.5s ease-in-out infinite; animation-delay: 1s; }
      .t3 { animation: twinkle 2.2s ease-in-out infinite; animation-delay: 0.5s; }
      @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 64px; fill: #C4B5FD; letter-spacing: 2px; }
      .role { font-family: 'Courier New', Consolas, monospace; font-size: 22px; fill: #3B82F6; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Nebulosas -->
  <ellipse cx="260" cy="260" rx="380" ry="170" fill="url(#neb1)"/>
  <ellipse cx="900" cy="60" rx="340" ry="150" fill="url(#neb2)"/>
  <ellipse cx="620" cy="300" rx="260" ry="90" fill="url(#neb1)" opacity="0.6"/>

  <!-- Estrellas -->
  <g fill="#C4B5FD">
    <circle class="t" cx="60" cy="40" r="1.6"/>
    <circle class="t2" cx="130" cy="110" r="1.2"/>
    <circle class="t3" cx="210" cy="30" r="1.8"/>
    <circle class="t" cx="330" cy="70" r="1.2"/>
    <circle class="t2" cx="420" cy="25" r="1.6"/>
    <circle class="t3" cx="520" cy="95" r="1.2"/>
    <circle class="t" cx="610" cy="40" r="1.8"/>
    <circle class="t2" cx="700" cy="115" r="1.2"/>
    <circle class="t3" cx="760" cy="30" r="1.6"/>
    <circle class="t" cx="850" cy="85" r="1.2"/>
    <circle class="t2" cx="920" cy="240" r="1.6"/>
    <circle class="t3" cx="1100" cy="45" r="1.8"/>
    <circle class="t" cx="1160" cy="120" r="1.2"/>
    <circle class="t2" cx="1130" cy="250" r="1.6"/>
    <circle class="t3" cx="80" cy="250" r="1.4"/>
    <circle class="t" cx="190" cy="215" r="1.2"/>
    <circle class="t2" cx="470" cy="260" r="1.6"/>
    <circle class="t3" cx="640" cy="230" r="1.2"/>
    <circle class="t" cx="800" cy="200" r="1.4"/>
    <circle class="t2" cx="990" cy="270" r="1.2"/>
  </g>
  <g fill="#FFFFFF">
    <circle class="t3" cx="290" cy="150" r="1"/>
    <circle class="t" cx="560" cy="170" r="1"/>
    <circle class="t2" cx="880" cy="150" r="1"/>
    <circle class="t3" cx="1180" cy="190" r="1"/>
  </g>

  <!-- Estrella con destello -->
  <g class="t2" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round">
    <line x1="960" y1="70" x2="960" y2="94"/>
    <line x1="948" y1="82" x2="972" y2="82"/>
  </g>

  <!-- Luna creciente con halo -->
  <circle cx="1020" cy="150" r="110" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="#C4B5FD" mask="url(#crescent)"/>

  <!-- Línea decorativa -->
  <line x1="80" y1="190" x2="520" y2="190" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="530" cy="190" r="4" fill="#3B82F6"/>

  <!-- Texto -->
  <text class="name" x="80" y="160">TU NOMBRE</text>
  <text class="role" x="82" y="228">TU ROL O FRASE CORTA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
